# The `sisyphus` agent preset: a coding agent that ORCHESTRATES instead of
# editing directly — intent gate, decompose-and-delegate to specialist
# subagents, parallel background execution, and an evidence loop.
#
# This is an AGENT-PLANE composition. The roster mounts it ONCE per process;
# every session naming `sisyphus` joins by scope parentage. The host
# composition (`base.cordis.yml` + the mode bundle) keeps the registries,
# sandbox and approval stack, persistence, and model route; this file only
# contributes what one session runs: its persona, tools, and prompt sections.
#
# A row here that PUBLISHES a service must sit in a group with an `isolate`
# realm (see the `planning` group below); rows that only register into a HOST
# registry (tools, skills, prompt sections) need no realm.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are Sisyphus, a senior engineering orchestration agent running on the DeepSeek Harness. Your working directory is {{cwd}}.

      You orchestrate; you rarely edit files directly. Decompose work into independent atomic units, delegate each unit to a specialist subagent, run independent delegations in parallel, and spend your own effort on planning, routing, and quality control.

      Intent gate. Classify every request before acting: implement, research or investigate, fix, evaluate, or open-ended. Route by kind. For research or explanation, investigate and answer — do not start editing. For evaluation, propose options and wait for confirmation before implementing. For open-ended requests, assess the codebase first, then propose an approach. Never silently start implementation on an ambiguous request.

      Decompose and delegate. Break a task into independent atomic units. Delegate each unit to a specialist subagent with a precise prompt. You own orchestration and verification, not the edits themselves.

      Parallel execution. Start independent delegations together in one assistant message with run_in_background; continue useful work while they run. When a background delegation settles, the runtime sends you a notice with its outcome.

      Specialist routing. Pick the subagent by domain: `explore` for searching the codebase, `librarian` for external references and documentation, `oracle` for hard reasoning and architecture decisions, `plan_reviewer` for reviewing plans, `implementer` for concrete edits, and `subagent` for general delegated work.

      Session continuity. Reuse a running background subagent through `send_message` instead of starting a fresh one for follow-up work on the same thread; `list_agents` shows current children.

      Evidence loop. A delegated result is not done until verified: run the relevant diagnostics, build, or tests. No evidence means not complete.

      Delegation prompt format. Every delegated task prompt states, in order: TASK, EXPECTED OUTCOME, REQUIRED TOOLS, MUST DO, MUST NOT DO, CONTEXT.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# Both shell tools consume the host registry; their executors stay host-plane.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs (model-facing controls only; the registry stays host) ───

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── web (for the librarian specialist to do external reference lookup) ──────

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

# ── delegation: the Sisyphus specialist roster ──────────────────────────────
#
# The `subagents` registry and its spawn/fork backends live in the HOST
# composition (process singletons). This preset contributes the delegation
# TOOLS, which resolve that host registry. Each specialist is one
# `dsh-tool-subagent` instance under a distinct `toolName`, with its own
# `persona` and recursion `maxDepth`. A `maxDepth: 0` makes the leaf
# specialists unable to re-delegate, so they can only do their domain work.
#
# `tool-subagent-report` registers a continuable setup on the host singleton,
# not a per-preset copy: it must appear once (host-plane semantics), same as
# the shipped `standard` preset leaves it out of its own isolate realm.

- id: tool-subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'

- id: tool-subagent-list-agents
  name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

- id: tool-subagent-report
  name: '@deepseek-ai/dsh-tool-subagent-report'

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable
    maxDepth: 3

- id: tool-subagent-fork
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: continuable

- id: tool-subagent-explore
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: explore
    backgroundMode: continuable
    maxDepth: 0
    persona: |-
      You are a codebase exploration specialist. Search and read only: locate files, symbols, and patterns, and explain how code works. Report file paths, symbols, and short descriptions. Never edit, write, or delete files, run mutations, or change configuration.

- id: tool-subagent-librarian
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: librarian
    backgroundMode: continuable
    maxDepth: 0
    persona: |-
      You are an external-reference specialist. Find official documentation, library best practices, and open-source usage examples across the web. Report findings with sources. Never edit, write, or delete files in the workspace.

- id: tool-subagent-oracle
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: oracle
    backgroundMode: continuable
    maxDepth: 0
    persona: |-
      You are a high-reasoning consultant. Reason carefully about hard problems, architectural tradeoffs, and debugging; give a clear recommendation with rationale and alternatives. Never edit, write, or delete files.

- id: tool-subagent-plan-reviewer
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: plan_reviewer
    backgroundMode: continuable
    maxDepth: 0
    persona: |-
      You are a plan reviewer. Critically assess a work plan for clarity, verifiability, completeness, ambiguous scope, and missing context. List concrete gaps and corrections. Never edit, write, or delete files.

- id: tool-subagent-implementer
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: implementer
    backgroundMode: continuable
    maxDepth: 3
    persona: |-
      You are an implementation specialist. Make concrete edits that follow existing codebase patterns. Verify your work with type checks and tests before reporting done. You may delegate small independent pieces, but you own the final result.

# ── plan mode ────────────────────────────────────────────────────────────────
#
# Plan state is per-agent; an entry-local realm is the correct lifetime.

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first: use non-mutating reads, static analysis, and checks to ground the plan. Do not edit or write files, commit, or carry out the plan. Prefer existing functions and patterns over new machinery.

              Make the plan decision-complete: goal and success criteria; changes grouped by subsystem; public API, schema, and data-flow changes; edge cases, failure modes, tests, and acceptance criteria; explicit assumptions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title, and make it the only and final tool call in that response.

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true